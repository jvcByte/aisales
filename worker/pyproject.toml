[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisales-worker"
version = "0.1.0"
description = "The queue worker: claims jobs and runs the agent turn"
requires-python = ">=3.11"
dependencies = ["aisales"]

[tool.setuptools.packages.find]
where = ["src"]
